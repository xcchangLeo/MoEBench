pid @PID_FILE@;
error_log @ERROR_LOG@ notice;
worker_processes @WORKERS@;

events {
    worker_connections 4096;
}

http {
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 127.0.0.1:18081;
        server_name localhost;
        root @DOCROOT@;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
